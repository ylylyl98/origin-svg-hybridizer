[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-svg-hybridizer"
version = "1.4.3"
description = "Turn dense Origin SVG heatmaps into compact hybrid SVG figures."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
origin-hybridizer = "origin_hybridizer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
