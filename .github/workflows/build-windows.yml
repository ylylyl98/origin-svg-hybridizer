name: Build Windows application

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install application and builder
        run: python -m pip install -e . "pyinstaller>=6.16,<7"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name "Origin SVG Hybridizer"
          --icon "packaging\origin-svg-hybridizer.ico"
          --add-data "packaging\origin-svg-hybridizer.ico;packaging"
          --version-file "packaging\version_info.txt"
          --paths "src"
          "packaging\windows_launcher.py"

      - name: Package application folder
        shell: pwsh
        run: >
          Compress-Archive
          -Path "dist\Origin SVG Hybridizer"
          -DestinationPath "Origin-SVG-Hybridizer-Windows-v$env:APP_VERSION.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v5
        with:
          name: origin-svg-hybridizer-windows-v${{ env.APP_VERSION }}
          path: Origin-SVG-Hybridizer-Windows-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "Origin-SVG-Hybridizer-Windows-v$env:APP_VERSION.zip"
          gh release create $tag $asset --title "Origin SVG Hybridizer $tag" --generate-notes
