name: Build Windows application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and builder
        run: python -m pip install -e . "pyinstaller>=6.16,<7"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name "Origin SVG Hybridizer"
          --icon "packaging\origin-svg-hybridizer.ico"
          --add-data "packaging\origin-svg-hybridizer.ico;packaging"
          --version-file "packaging\version_info.txt"
          --paths "src"
          "packaging\windows_launcher.py"

      - name: Package application folder
        shell: pwsh
        run: >
          Compress-Archive
          -Path "dist\Origin SVG Hybridizer\*"
          -DestinationPath "Origin-SVG-Hybridizer-Windows-v1.3.1.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: origin-svg-hybridizer-windows-v1.3.1
          path: Origin-SVG-Hybridizer-Windows-v1.3.1.zip
          if-no-files-found: error
          retention-days: 30
